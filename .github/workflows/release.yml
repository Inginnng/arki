name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.3.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Inginnng/arki'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      ARKI_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:release
      - run: pnpm release:pack
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
        env:
          ARKI_BROWSER_CHANNEL: chromium
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:ARKI_RELEASE_TAG --verify-tag --repo $env:GITHUB_REPOSITORY --title "Arki · 一览 $version" --notes-file "docs/releases/$env:ARKI_RELEASE_TAG.md" "release/arki-$version.zip" release/SHA256SUMS.txt release/release-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
